# RUSM — an Erlang-inspired WebAssembly runtime in Rust.
#
# This is the Cargo *workspace* root. Each member crate has a single, focused
# responsibility (see `docs/01-architecture.md`). Phase 0 ships the
# observability + benchmark foundation; the runtime crates (engine, processes,
# host ABI) arrive in later phases — see `docs/02-roadmap.md`.
[workspace]
resolver = "2"
members = [
    "crates/rusm-logfmt",
    "crates/rusm-otp",
    "crates/rusm-wasm",
    "crates/rusm-wire",
    "crates/rusm-kv",
    "crates/rusm-cluster",
    "crates/rusm-jsc",
    "crates/rusm-metrics",
    "crates/rusm-observer",
    "crates/rusm-node",
    "bench/rusm-bench",
    "bench/rusm-loadtest",
    "rusm-cli",
    # Worked custom-bridge host crates — their compilation proves the generated host-side
    # pattern (the bindgen world + bindings + the host.rs convention) is valid Rust against
    # the real rusm-wasm/rusm-cli API. Their guest components are wasm-only (excluded below).
    "examples/weather-api/rust",
    "examples/mailer/rust",
]
# Guest test fixtures are wasm-only crates built separately for wasm32-wasip2 and
# checked in as prebuilt .wasm; they must not build for the host target. `rusm-rs`
# is the wasm-only Rust *guest* crate (depended on by guests, not the host). The
# weather-api and mailer example guest components are likewise wasm-only.
exclude = [
    "crates/rusm-wasm/tests/fixtures",
    "crates/rusm-rs",
    "crates/rusm-rs-macros",
    "examples/weather-api/rust/components",
    "examples/mailer/rust/components",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Paul Engel <pm_engel@icloud.com>"]
repository = "https://github.com/archan937/rusm"
description = "An Erlang-inspired WebAssembly runtime in Rust."

# Shared dependency versions live here so member crates stay in lock-step.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
