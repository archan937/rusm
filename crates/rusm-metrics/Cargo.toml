[package]
name = "rusm-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Latency histograms, counters, and time-series for RUSM observability."
# Repo-internal: the live-observability surface is consumed only by the bench dashboard
# (`bench/rusm-bench`, itself `publish = false`); nothing published — the CLI, the guest
# SDKs, or the embeddable runtime/cluster crates — depends on it.
publish = false

[dependencies]
serde = { workspace = true }
hdrhistogram = "7"

[dev-dependencies]
serde_json = { workspace = true }
