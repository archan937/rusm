[package]
name = "rusm-wasm"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Wasmtime backend for RUSM: each process runs as an isolated Wasm instance."
# Keep the published crate lean: the ~3 MB of `tests/fixtures/*.wasm` are only used
# by `#[cfg(test)]` code (never the library), so they don't belong in the package.
# The embedded js-runner artifacts (js-runner/*.wasm) live outside tests/ and ship.
exclude = ["tests/"]

[dependencies]
rusm-otp = { path = "../rusm-otp", version = "0.2.0" }
# Shared log palette/format — the host stamps + colours guest `log` lines through it, so
# they read as one stream with the platform's own lifecycle logs.
rusm-logfmt = { path = "../rusm-logfmt", version = "0.2.0" }
# The durable KV store surfaced to guests behind the `storage` capability.
rusm-kv = { path = "../rusm-kv", version = "0.2.0" }
anyhow = { workspace = true }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
wasmtime = "45.0.1"
# p1 + p2 (default) for the wasip1/wasip2 bridges; `p3` for the wasip3 bridge
# (preview3 WASI on the component linker). Every enabled feature is used.
wasmtime-wasi = { version = "45.0.1", features = ["p3"] }
wasmtime-wasi-http = "45.0.1"
hyper = { version = "1", features = ["server", "http1"] }
tokio-tungstenite = "0.29"
# Response compression (opt-in per `[[serve]]` listener): gzip for HTTP/SSE replies and
# raw deflate for WebSocket permessage-deflate. Host-only — never crosses into a guest.
flate2 = "1"
# The WebSocket permessage-deflate frame transport (`bridges/ws_codec.rs`) drives an async
# `Framed` over tungstenite's frame primitives — no async WS lib exposes the RSV1 bit
# permessage-deflate needs, so the frame codec is ours (built on tungstenite's parse/format).
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
# The resident-serving gateway speaks the JSON actor wire (request/reply envelopes);
# the request/response types (base64 bodies) are shared with the guest via rusm-wire.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusm-wire = { path = "../rusm-wire", version = "0.2.0" }
# Native TLS for serving (`wss`/`https`): an opt-in per-`[[serve]]` listener terminates
# TLS before hyper. rustls + ring (same stack as the cluster transport); pemfile loads the
# cert/key. Host-only.
# ring-only (no default `aws_lc_rs`, which would pull a cmake/C build) — the same crypto
# provider the cluster transport uses.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
# The routed-gateway test drives the real manifest route matcher (a sibling crate;
# rusm-node depends only on rusm-otp, so no cycle) — proving the exact wiring rusm-cli uses.
rusm-node = { path = "../rusm-node", version = "0.2.0" }
# A self-signed cert for the TLS serving tests (same generator + version the cluster uses).
rcgen = "0.10"
