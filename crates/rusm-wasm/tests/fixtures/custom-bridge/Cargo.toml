# A guest fixture that imports a CUSTOM application bridge (`demo:bridge/greet`)
# alongside the standard rusm interfaces — it proves `WasmRuntime::with_bridges`
# wires an app's own typed host function into the component linker. Built for
# wasm32-wasip2, checked in as custom_bridge.wasm. Regenerate:
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/custom_bridge.wasm ../custom_bridge.wasm
[workspace]

[package]
name = "custom-bridge"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "custom_bridge"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = { path = "../../../../rusm-rs" }
wit-bindgen = "0.46"
