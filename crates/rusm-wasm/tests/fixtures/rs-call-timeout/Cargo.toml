# A Rust guest that calls a "black hole" service (receives, never replies) with a 50ms
# timeout and sends the outcome ("timeout", "err:…", or "got:…") to a collector.
# Built for wasm32-wasip2, checked in as rs_call_timeout.wasm.
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/rs_call_timeout.wasm ../rs_call_timeout.wasm
[workspace]

[package]
name = "rs-call-timeout"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "rs_call_timeout"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = { path = "../../../../rusm-rs" }
wit-bindgen = "0.46"
