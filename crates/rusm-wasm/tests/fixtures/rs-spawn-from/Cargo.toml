# A Rust guest that loads runtime JS: it spawns a dynamic instance of the "runner"
# template with an inline JS bundle (rusm_rs::spawn_from). Built for wasm32-wasip2,
# checked in as rs_spawn_from.wasm. Regenerate:
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/rs_spawn_from.wasm ../rs_spawn_from.wasm
[workspace]

[package]
name = "rs-spawn-from"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "rs_spawn_from"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = { path = "../../../../rusm-rs" }
wit-bindgen = "0.46"
