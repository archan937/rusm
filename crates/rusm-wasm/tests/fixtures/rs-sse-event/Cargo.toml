# A per-connection SSE handler (rusm-rs) that emits a rich event (data + id + event) via
# Stream::emit — proving the additive sse-send op (id:/event:/retry: framing). Built for
# wasm32-wasip2, checked in as rs_sse_event.wasm. Regenerate:
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/rs_sse_event.wasm ../rs_sse_event.wasm
[workspace]

[package]
name = "rs-sse-event"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "rs_sse_event"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = { path = "../../../../rusm-rs" }
wit-bindgen = "0.46"
