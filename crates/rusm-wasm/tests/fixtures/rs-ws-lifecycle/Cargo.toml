# A per-connection WebSocket handler (rusm-rs) exercising the FULL lifecycle —
# open / message / close — reporting "open" and "close" to a registered `collector` so a
# test can assert `close` fires when the socket drops. Built for wasm32-wasip2, checked in
# as rs_ws_lifecycle.wasm. Regenerate:
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/rs_ws_lifecycle.wasm ../rs_ws_lifecycle.wasm
[workspace]

[package]
name = "rs-ws-lifecycle"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "rs_ws_lifecycle"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = { path = "../../../../rusm-rs" }
wit-bindgen = "0.46"
