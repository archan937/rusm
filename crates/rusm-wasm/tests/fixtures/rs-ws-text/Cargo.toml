# A WebSocket handler (rusm-rs) that replies with a TEXT frame via Connection::send_text —
# proving the additive ws-send-text op (the default send is binary). Built for
# wasm32-wasip2, checked in as rs_ws_text.wasm. Regenerate:
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/rs_ws_text.wasm ../rs_ws_text.wasm
[workspace]

[package]
name = "rs-ws-text"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "rs_ws_text"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = { path = "../../../../rusm-rs" }
wit-bindgen = "0.46"
