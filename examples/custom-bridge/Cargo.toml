# The host binary for an app with a CUSTOM BRIDGE (the Option-1 model): it registers the
# app's `bridges/<name>/` host impls, then serves the manifest via `rusm_cli::host`. A
# pure-guest app needs no such crate (`rusm serve` hosts it directly); an app that adds a
# native host capability compiles this small, explicit host. `rusm new --bridges` scaffolds
# it; `rusm build` (re)generates `src/{bindings,bridges}.rs` + `wit/` from `bridges/`.
[package]
name = "custom-bridge-example"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "custom-bridge-example"
path = "src/main.rs"

[dependencies]
rusm-cli = { path = "../../rusm-cli" }
rusm-wasm = { path = "../../crates/rusm-wasm" }
rusm-node = { path = "../../crates/rusm-node" }
# Same version rusm-wasm links — `bindgen!` emits `wasmtime::` paths, so the host crate
# needs Wasmtime in its extern prelude; the exact match makes the generated types identical
# to the runtime's (`rusm build` pins this for a scaffolded app).
wasmtime = "45.0.1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
