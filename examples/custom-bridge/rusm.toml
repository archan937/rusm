# A custom-bridge app: it serves HTTP handlers (a Rust guest and a Go guest) that each call
# the app's own `weather` bridge — a native host function registered by this app's host
# binary. The two guests prove a custom bridge is callable from any wit-based language.
[node]
listen = "127.0.0.1:8080"

# Both handlers may import the custom `weather` bridge — default-deny, granted by name.
# Built-in capabilities (network/storage/…) are unrelated and stay off.
[capabilities.forecaster]
inherits = "sandboxed"
bridges = ["weather"]

[[serve]]
name = "api"
protocol = "http"
listen = "127.0.0.1:8080"

# `/forecast/:city` → the Rust handler; `/go/forecast/:city` → the Go handler. Both run under
# `forecaster` (so they may call the weather bridge) and return the same host-computed value.
[serve.routes]
"GET /forecast/:city" = "api#forecast"
"GET /go/forecast/:city" = "go-api#forecast"

[components.api]
capability = "forecaster"

[components.go-api]
capability = "forecaster"
