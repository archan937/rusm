# A custom-bridge app: it serves an HTTP endpoint whose handler (a Rust guest) calls the
# app's own `weather` bridge — a native host function registered by this app's host binary.
[node]
listen = "127.0.0.1:8080"

# The handler may import the custom `weather` bridge — default-deny, granted by name. Built-in
# capabilities (network/storage/…) are unrelated and stay off.
[capabilities.forecaster]
inherits = "sandboxed"
bridges = ["weather"]

[[serve]]
name = "api"
protocol = "http"
listen = "127.0.0.1:8080"

# Route every request to the `api` handler component, which runs under the `forecaster`
# profile so it may call the weather bridge.
[serve.routes]
"GET /forecast/:city" = "api#forecast"

[components.api]
capability = "forecaster"
