# mailer/go — Go bridge host + Go HTTP guest.
# Set RESEND_API_KEY in .env before serving.
# Run: rusm build && rusm serve
[node]
listen = "127.0.0.1:8080"

[capabilities.notifier]
inherits = "sandboxed"
bridges = ["mailer"]

[[serve]]
protocol = "http"
listen = "127.0.0.1:8080"

[serve.routes]
"POST /send" = "api#post"

[components.api]
capability = "notifier"
