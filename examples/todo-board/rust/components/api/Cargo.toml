# The todo HTTP API — a routed `#[rusm_rs::handlers]` component (HTTP routes to actions
# in rusm.toml's [serve.routes]). Standalone ([workspace]) so it builds for wasm32-wasip2
# on its own; shares the todo model with the feed via the `todos` path dep.
[workspace]

[package]
name = "api"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "api"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = "0.5.0"
todos = { path = "../../todos" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
