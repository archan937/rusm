# The live todo feed — a per-connection `sse::serve` handler.
[workspace]

[package]
name = "feed"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "feed"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
rusm-rs = "0.5.0"
todos = { path = "../../todos" }
wit-bindgen = "0.46"
log = "0.4"
