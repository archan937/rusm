# A collaborative todo board in Rust — the same components as the TypeScript example,
# idiomatic to Rust:
#   • api      (HTTP) — #[rusm_rs::handlers] actions, routed declaratively (below); CRUD in
#                       kv + serves the web page at `/`, publishing each change to subscribers
#   • feed     (SSE)  — a per-connection sse::serve handler that streams the live todo list
#   • chat     (WS)   — a per-connection ws::serve handler; rooms over process-group tags
#   • store  (service) — its exported fns ARE the API; the typed-client target (composition)
#   • reporter (worker) — resident; drives the store via store::Client (call/cast/stream/cb)
# `rusm build` compiles each components/<name>/ with cargo (wasm32-wasip2); `rusm serve`
# hosts the three listeners and boots the resident reporter.

[node]
store = "data.redb"          # durable kv for the todos

[log]
level = "info"               # surface the components' log::info! lines

# Routed HTTP: the api's actions are dispatched by method + path (Rust handlers route
# declaratively, unlike the self-routing TS fetch handler).
[[serve]]
protocol = "http"
listen = "127.0.0.1:8080"

[serve.routes]
"GET /"               = "api#home"
"GET /todos"          = "api#list"
"POST /todos"         = "api#create"
"PATCH /todos/:id"    = "api#toggle"
"DELETE /todos/:id"   = "api#remove"
"OPTIONS /todos"      = "api#preflight"
"OPTIONS /todos/:id"  = "api#preflight"

[[serve]]
component = "feed"
protocol = "sse"
listen = "127.0.0.1:8081"

# This listener's response policy: let the page (served from :8080) read this cross-origin
# SSE feed. CORS is the app's policy, declared here; the platform just applies it.
[serve.headers]
"access-control-allow-origin" = "*"

[[serve]]
component = "chat"
protocol = "ws"
listen = "127.0.0.1:8082"

# api/feed/store read/write the durable todo list; chat needs none; reporter spawns store.
[capabilities.stateful]
inherits = "sandboxed"       # default-deny base
allow-storage = true         # + durable kv

[capabilities.spawner]
inherits = "sandboxed"
allow-spawn = true           # the reporter spawns the store service

[components.api]
capability = "stateful"

[components.feed]
capability = "stateful"

[components.chat]
capability = "sandboxed"

# A service spawned on demand by the reporter (reached via the typed client); runs under
# its own profile whoever spawns it.
[components.store]
capability = "stateful"

# A resident worker: boot-spawned + supervised; drives the store through the typed client.
[components.reporter]
capability = "spawner"
resident = true
