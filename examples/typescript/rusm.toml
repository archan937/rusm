# A collaborative todo board in TypeScript — three RUSM serving components:
#   • api  (HTTP) — CRUD todos in durable kv, publishing each change to subscribers
#   • feed (SSE)  — a live stream of the todo list (pushed via process-group tags, never polled)
#   • chat (WS)   — rooms over process-group tags
# `rusm build` bundles each components/<name>/index.ts; `rusm serve` hosts all three.

[node]
store = "data.redb"          # durable kv for the todos (created on first write)

[log]
level = "info"               # surface the components' console.log lines

[[serve]]
name = "api"
protocol = "http"
listen = "127.0.0.1:8080"

[[serve]]
name = "feed"
protocol = "sse"
listen = "127.0.0.1:8081"

[[serve]]
name = "chat"
protocol = "ws"
listen = "127.0.0.1:8082"

# api and feed read/write the durable todo list; chat is stateless (tags only).
[capabilities.stateful]
inherits = "sandboxed"       # default-deny base
allow-storage = true         # + durable kv

[components.api]
capability = "stateful"

[components.feed]
capability = "stateful"

[components.chat]
capability = "sandboxed"
